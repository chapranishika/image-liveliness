name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # MediaPipe (blaze_face_short_range.tflite, face_landmarker.task) and
      # DeepFace (~/.deepface weights) both auto-download on first use --
      # cached so repeated runs don't re-download several hundred MB every
      # time. Keyed on requirements.txt since a dependency bump is the only
      # thing likely to change what gets downloaded.
      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: |
            *.tflite
            *.task
            ~/.deepface
          key: model-weights-${{ hashFiles('requirements.txt') }}

      - name: Run backend test suite
        run: pytest tests/ --ignore=tests/playwright -v

  ui-contrast-tests:
    name: UI contrast/regression tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # Deliberately NOT requirements.txt: tests/playwright's fixture app
      # only imports app.styles/app.branding_config (plain constants, no
      # ML), so this job skips MediaPipe/DeepFace/TensorFlow entirely --
      # keeps this job fast, and the two jobs failing independently makes
      # it obvious whether a break is backend logic or frontend styling.
      # opencv-python and cryptography are needed transitively: pytest
      # auto-loads tests/conftest.py for anything under tests/ (including
      # tests/playwright/), and that file imports cv2 and src.db at
      # module level regardless of which specific tests are selected --
      # confirmed by actually running this exact install list in an
      # isolated venv, not assumed.
      - name: Install lightweight UI-test dependencies
        run: pip install streamlit pytest pytest-playwright pillow numpy opencv-python cryptography

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('.github/workflows/tests.yml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install --with-deps chromium firefox webkit

      - name: Install Playwright OS dependencies only (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium firefox webkit

      - name: Run UI contrast/regression tests (chromium, firefox, webkit)
        run: pytest tests/playwright/ --browser chromium --browser firefox --browser webkit -v

  enforce-ui-test-coverage:
    name: UI changes must include Playwright test updates
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Structural enforcement of CONTRIBUTING.md's "verify against the
      # real rendered page" rule -- this project shipped several contrast
      # bugs because a CSS fix looked correct on paper and was never
      # actually checked. A PR touching styling files without touching
      # tests/playwright/ is exactly the pattern that let that happen, so
      # it fails the build instead of relying on someone remembering.
      - name: Check that UI/styling changes are accompanied by Playwright test changes
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          echo "Changed files in this PR:"
          echo "$CHANGED"

          UI_CHANGED=$(echo "$CHANGED" | grep -E '^app/styles\.py$|^app/streamlit_app\.py$|^app/branding_config\.py$' || true)
          TESTS_CHANGED=$(echo "$CHANGED" | grep -E '^tests/playwright/' || true)

          if [ -n "$UI_CHANGED" ] && [ -z "$TESTS_CHANGED" ]; then
            echo "::error::This PR changes UI/styling files but doesn't touch tests/playwright/:"
            echo "::error::$UI_CHANGED"
            echo "::error::See CONTRIBUTING.md -- verify the change against the real rendered page (tests/playwright/style_probe_app.py) and add/update a test, rather than trusting the change on reasoning alone."
            exit 1
          fi
          echo "OK: no UI/styling files changed, or Playwright tests were updated alongside them."

  docker-smoke-test:
    name: Docker build + runtime smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # docs/deployment.md's "Verified" section previously only claimed
      # `docker build` finishes cleanly -- it never actually started the
      # built image and confirmed it serves real traffic. This closes that
      # gap: build once, run both real services from docker-compose.yml,
      # and hit each one's real health endpoint, not just check the
      # container didn't immediately exit.
      - name: Generate a throwaway .env for this run
        run: |
          pip install --quiet cryptography
          KEY=$(python3 -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
          echo "FACE_DB_ENCRYPTION_KEY=$KEY" > .env
          echo "FACE_API_KEY=smoke-test-key-not-real" >> .env

      - name: Build and start both services
        run: docker compose up --build -d

      - name: Wait for the backend's real /health endpoint
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health -o /tmp/health.json; then
              echo "Backend responded after ${i}0s max wait:"
              cat /tmp/health.json
              STATUS=$(python3 -c "import json; print(json.load(open('/tmp/health.json'))['status'])")
              if [ "$STATUS" = "healthy" ]; then
                echo "OK: backend reports healthy"
                exit 0
              else
                echo "::error::Backend responded but reported status='$STATUS', not 'healthy':"
                cat /tmp/health.json
                exit 1
              fi
            fi
            sleep 10
          done
          echo "::error::Backend never responded on :8000/health within 300s"
          docker compose logs backend
          exit 1

      - name: Wait for the frontend's Streamlit health endpoint
        run: |
          # Model warmup is a real, previously-measured ~28s cost
          # (docs/deployment.md) -- generous retry budget to cover that
          # plus container startup on a CI runner, which can be slower
          # than a local dev machine.
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8501/_stcore/health; then
              echo "OK: frontend responded on :8501/_stcore/health"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Frontend never responded on :8501/_stcore/health within 300s"
          docker compose logs frontend
          exit 1

      - name: Tear down
        if: always()
        run: docker compose down -v

  publish-image:
    name: Publish Docker image to GHCR
    runs-on: ubuntu-latest
    needs: [backend-tests, ui-contrast-tests, docker-smoke-test]
    # Only publish a verified build of main, never an untested PR branch --
    # every job above must succeed first, including the runtime smoke test
    # (a build that succeeds but never actually boots must not get
    # published as "latest"). Doesn't deploy this anywhere
    # live (see docs/deployment.md's disclosed gap on that); this just makes
    # "pull and run the latest built image" fully automated instead of a
    # manual `docker build` on someone's own machine.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
